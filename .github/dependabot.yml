version: 2
updates:
    - package-ecosystem: npm
      directory: "/"
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      labels: ["CHORE"]
      groups:
          astro:
              patterns: ["astro", "@astrojs/*"]
          fumadocs:
              patterns: ["fumadocs-*"]
          react:
              patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
          tooling:
              patterns: ["oxlint", "oxfmt", "typescript", "vitest", "@playwright/*"]

    - package-ecosystem: github-actions
      directory: "/"
      schedule:
          interval: monthly
      labels: ["CHORE"]
